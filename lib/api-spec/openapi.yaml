openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AIO Voice Connect Configuration Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: IPBX management
  - name: extensions
    description: SIP extension management
  - name: agentConfigs
    description: AI agent configuration
  - name: agentTools
    description: AI agent tool definitions
  - name: outbound
    description: Outbound call management
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all IPBXs
      responses:
        "200":
          description: List of IPBXs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create an IPBX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "201":
          description: Created IPBX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get an IPBX by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: IPBX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update an IPBX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "200":
          description: Updated IPBX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete an IPBX
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /extensions:
    get:
      operationId: listExtensions
      tags: [extensions]
      summary: List all extensions
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of extensions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Extension"
    post:
      operationId: createExtension
      tags: [extensions]
      summary: Create an extension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExtensionInput"
      responses:
        "201":
          description: Created extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"

  /extensions/{id}:
    get:
      operationId: getExtension
      tags: [extensions]
      summary: Get an extension by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateExtension
      tags: [extensions]
      summary: Update an extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExtensionInput"
      responses:
        "200":
          description: Updated extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
    delete:
      operationId: deleteExtension
      tags: [extensions]
      summary: Delete an extension
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agent-configs:
    get:
      operationId: listAgentConfigs
      tags: [agentConfigs]
      summary: List all agent configs
      responses:
        "200":
          description: List of agent configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentConfig"
    post:
      operationId: createAgentConfig
      tags: [agentConfigs]
      summary: Create an agent config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentConfigInput"
      responses:
        "201":
          description: Created agent config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"

  /agent-configs/{id}:
    get:
      operationId: getAgentConfig
      tags: [agentConfigs]
      summary: Get an agent config by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAgentConfig
      tags: [agentConfigs]
      summary: Update an agent config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentConfigInput"
      responses:
        "200":
          description: Updated agent config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
    delete:
      operationId: deleteAgentConfig
      tags: [agentConfigs]
      summary: Delete an agent config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agent-tools:
    get:
      operationId: listAgentTools
      tags: [agentTools]
      summary: List tools for an agent config
      parameters:
        - name: agentConfigId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of agent tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTool"
    post:
      operationId: createAgentTool
      tags: [agentTools]
      summary: Create an agent tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentToolInput"
      responses:
        "201":
          description: Created agent tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTool"

  /agent-tools/{id}:
    get:
      operationId: getAgentTool
      tags: [agentTools]
      summary: Get an agent tool by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTool"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAgentTool
      tags: [agentTools]
      summary: Update an agent tool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentToolInput"
      responses:
        "200":
          description: Updated agent tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTool"
    delete:
      operationId: deleteAgentTool
      tags: [agentTools]
      summary: Delete an agent tool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /outbound/call:
    post:
      operationId: triggerOutboundCall
      tags: [outbound]
      summary: Trigger an outbound call (public — use X-Api-Key header)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerOutboundCallInput"
      responses:
        "202":
          description: Call accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundCall"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /outbound/calls:
    get:
      operationId: listOutboundCalls
      tags: [outbound]
      summary: List outbound call history
      parameters:
        - name: extensionId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of outbound calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundCall"

  /outbound/calls/{id}:
    get:
      operationId: getOutboundCall
      tags: [outbound]
      summary: Get an outbound call by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outbound call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundCall"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /outbound/context/{extensionId}:
    get:
      operationId: getOutboundContext
      tags: [outbound]
      summary: Get pending outbound call context for an extension (called by sip-agent)
      parameters:
        - name: extensionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outbound context or empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundContext"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardStats:
      type: object
      properties:
        totalClients:
          type: integer
        totalExtensions:
          type: integer
        totalAgentConfigs:
          type: integer
        extensionsByProvider:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              count:
                type: integer
            required:
              - provider
              - count
      required:
        - totalClients
        - totalExtensions
        - totalAgentConfigs
        - extensionsByProvider

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        sipDomain:
          type: string
          nullable: true
        sipServer:
          type: string
          nullable: true
        yeastarApiUrl:
          type: string
          nullable: true
          description: Yeastar PBX HTTP API base URL for outbound call triggering
        yeastarClientId:
          type: string
          nullable: true
          description: Yeastar API OAuth Client ID
        yeastarClientSecret:
          type: string
          nullable: true
          description: Yeastar API token
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    CreateClientInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        sipDomain:
          type: string
          nullable: true
        sipServer:
          type: string
          nullable: true
        yeastarApiUrl:
          type: string
          nullable: true
        yeastarClientId:
          type: string
          nullable: true
          description: Yeastar API OAuth Client ID
        yeastarClientSecret:
          type: string
          nullable: true
      required:
        - name

    Extension:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
          nullable: true
        agentConfigId:
          type: integer
          nullable: true
        extensionNumber:
          type: string
        displayName:
          type: string
          nullable: true
        sipUsername:
          type: string
        sipAuthId:
          type: string
        sipPassword:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        client:
          $ref: "#/components/schemas/Client"
          nullable: true
        agentConfig:
          $ref: "#/components/schemas/AgentConfig"
          nullable: true
      required:
        - id
        - extensionNumber
        - sipUsername
        - sipAuthId
        - sipPassword
        - createdAt
        - updatedAt

    CreateExtensionInput:
      type: object
      properties:
        clientId:
          type: integer
          nullable: true
        agentConfigId:
          type: integer
          nullable: true
        extensionNumber:
          type: string
        displayName:
          type: string
          nullable: true
        sipUsername:
          type: string
        sipAuthId:
          type: string
        sipPassword:
          type: string
      required:
        - extensionNumber
        - sipUsername
        - sipAuthId
        - sipPassword

    AiProvider:
      type: string
      enum:
        - openai
        - elevenlabs
        - gemini
        - deepgram
        - cartesia

    AgentConfigMode:
      type: string
      enum:
        - inbound
        - outbound
        - both

    AgentConfig:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          $ref: "#/components/schemas/AiProvider"
        apiKey:
          type: string
        voiceId:
          type: string
          nullable: true
        modelId:
          type: string
          nullable: true
        systemPrompt:
          type: string
          nullable: true
        greeting:
          type: string
          nullable: true
        mode:
          $ref: "#/components/schemas/AgentConfigMode"
        language:
          type: string
          nullable: true
        extraConfig:
          type: string
          nullable: true
          description: JSON string for provider-specific extra fields
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - provider
        - apiKey
        - createdAt
        - updatedAt

    CreateAgentConfigInput:
      type: object
      properties:
        name:
          type: string
        provider:
          $ref: "#/components/schemas/AiProvider"
        apiKey:
          type: string
        voiceId:
          type: string
          nullable: true
        modelId:
          type: string
          nullable: true
        systemPrompt:
          type: string
          nullable: true
        greeting:
          type: string
          nullable: true
        mode:
          $ref: "#/components/schemas/AgentConfigMode"
        language:
          type: string
          nullable: true
        extraConfig:
          type: string
          nullable: true
      required:
        - name
        - provider
        - apiKey

    AgentToolExecutionType:
      type: string
      enum:
        - http_request
        - webhook
        - transfer_call
        - hang_up
        - send_dtmf
        - custom_js

    AgentTool:
      type: object
      properties:
        id:
          type: integer
        agentConfigId:
          type: integer
        name:
          type: string
        description:
          type: string
        parametersSchema:
          type: string
          nullable: true
          description: JSON Schema string describing the tool's parameters
        executionType:
          $ref: "#/components/schemas/AgentToolExecutionType"
        executionConfig:
          type: string
          nullable: true
          description: JSON config specific to the execution type
        timeout:
          type: integer
          description: Execution timeout in seconds
        requireConfirmation:
          type: boolean
        enabled:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - agentConfigId
        - name
        - description
        - executionType
        - timeout
        - requireConfirmation
        - enabled
        - sortOrder
        - createdAt
        - updatedAt

    CreateAgentToolInput:
      type: object
      properties:
        agentConfigId:
          type: integer
        name:
          type: string
        description:
          type: string
        parametersSchema:
          type: string
          nullable: true
        executionType:
          $ref: "#/components/schemas/AgentToolExecutionType"
        executionConfig:
          type: string
          nullable: true
        timeout:
          type: integer
          default: 10
        requireConfirmation:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          default: 0
      required:
        - agentConfigId
        - name
        - description
        - executionType

    OutboundCallStatus:
      type: string
      enum:
        - pending
        - dialing
        - active
        - completed
        - failed

    OutboundCall:
      type: object
      properties:
        id:
          type: integer
        extensionId:
          type: integer
          nullable: true
        phoneNumber:
          type: string
        callerId:
          type: string
          nullable: true
        variables:
          type: string
          nullable: true
          description: JSON string of runtime variables
        firstMessage:
          type: string
          nullable: true
        systemPromptOverride:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
          description: JSON string of caller metadata
        webhookUrl:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OutboundCallStatus"
        callId:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
          description: JSON string of call outcome
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - phoneNumber
        - status
        - createdAt
        - updatedAt

    TriggerOutboundCallInput:
      type: object
      properties:
        extensionId:
          type: integer
          description: Extension to use for the outbound call
        phoneNumber:
          type: string
          description: Target phone number to call
        callerId:
          type: string
          nullable: true
          description: Caller ID to present to the callee
        variables:
          type: object
          nullable: true
          description: Runtime context variables injected into the AI conversation
          additionalProperties: true
        firstMessage:
          type: string
          nullable: true
          description: Override the agent's first message for this call
        systemPromptOverride:
          type: string
          nullable: true
          description: Override the agent's system prompt for this call
        metadata:
          type: object
          nullable: true
          description: Arbitrary metadata stored with the call record
          additionalProperties: true
        webhookUrl:
          type: string
          nullable: true
          description: URL to POST call result to when the call ends
      required:
        - extensionId
        - phoneNumber

    OutboundContext:
      type: object
      properties:
        pending:
          type: boolean
        firstMessage:
          type: string
          nullable: true
        systemPromptOverride:
          type: string
          nullable: true
        variables:
          type: object
          nullable: true
          additionalProperties: true
        callId:
          type: integer
          nullable: true
      required:
        - pending
